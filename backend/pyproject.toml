[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=1.26.0",
    "sentence-transformers>=2.2.2",
    "python-multipart>=0.0.9",
    "openai>=2.46.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = ["ruff>=0.8.0"]

[tool.ruff]
target-version = "py39"
line-length = 100
